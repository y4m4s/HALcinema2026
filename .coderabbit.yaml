language: "ja-JP"

tone_instructions: >
  丁寧でわかりやすい日本語でレビューしてください。
  初学者にも理解できるよう、指摘の理由と改善方法を具体的に説明してください。
  高圧的な表現や過度な細かい指摘は避けてください。

reviews:
  profile: "chill"

  # PR全体で何が変更されたのか理解しやすくする
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  changed_files_summary: true

  # CodeRabbitがPRをブロックする運用にはしない。
  # 最終判断は人間のレビュアーが行う。
  request_changes_workflow: false

  # 不要な遊び要素
  poem: false
  in_progress_fortune: false

  # チーム向けレビュー方針
  path_instructions:
    - path: "**/*"
      instructions: |
        このリポジトリは、経験や技術知識の異なるメンバーが参加するチーム開発です。

        レビューでは、単に問題点を指摘するだけでなく、
        「何が問題なのか」「なぜ問題なのか」「どのように改善できるのか」
        が理解できるように説明してください。

        特に以下を重視してください。

        - バグや意図しない挙動につながる可能性
        - セキュリティ上の問題
        - エラーハンドリングの不足
        - null / undefined や境界値などの考慮漏れ
        - 非同期処理、状態管理、リソース解放などに関する問題
        - 将来的に保守しづらくなる実装
        - 同じ処理の不必要な重複
        - 可読性を大きく損なう実装
        - テストで確認した方がよい重要なケース

        指摘するときは、可能な限り以下の順序で説明してください。

        1. 何が問題なのか
        2. なぜ問題になるのか
        3. どのような状況で問題が発生するのか
        4. どう修正するとよいのか

        技術用語や特定の設計パターンを使う場合は、
        必要に応じて短く意味を説明してください。

        コードスタイルの好みだけに基づく指摘や、
        動作・保守性にほとんど影響しない細かな指摘は控えてください。

        良し悪しを断定するだけではなく、
        チームメンバーがレビューを通して知識を得られる説明を心がけてください。

  auto_review:
    enabled: true

    # Draft状態のPRもレビューする
    drafts: true

    # デフォルトブランチ(main)に加えて、developへのPRもレビュー対象にする
    base_branches:
      - "develop"

    # push後の変更についても再レビュー
    auto_incremental_review: true

chat:
  auto_reply: true